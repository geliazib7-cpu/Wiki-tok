name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        run: npm install

      - name: Preparar el proyecto de Android
        run: node prepare.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Llave de firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nombrar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk walkie-claves.apk

      - name: Guardar el APK como archivo de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: walkie-claves-apk
          path: walkie-claves.apk

      - name: Publicar el APK en Releases (para bajarlo directo desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Walkie Claves APK ${{ github.run_number }}
          body: APK de prueba. Descárgalo e instálalo en tu Android.
          files: walkie-claves.apk
