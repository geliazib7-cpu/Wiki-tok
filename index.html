<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f1720">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Walkie Claves</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de entrada -->
  <section id="join" class="screen">
    <div class="join-box">
      <h1>Walkie Claves</h1>
      <p class="sub">Radio por internet entre teléfonos, con claves detectadas por voz.</p>

      <label for="name">Tu nombre</label>
      <input id="name" type="text" maxlength="20" placeholder="Ej. Luis" autocomplete="off">

      <label for="room">Código de sala</label>
      <input id="room" type="text" maxlength="24" placeholder="Todos usan el mismo código" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">

      <label for="role">Tu rol (opcional)</label>
      <select id="role"></select>

      <button id="enter" class="primary">Entrar a la sala</button>
      <p id="joinMsg" class="msg"></p>
      <p class="hint">Al entrar te pediré permiso para usar el micrófono. Funciona con datos o wifi, hasta 8 personas por sala.</p>
    </div>
  </section>

  <!-- Pantalla principal -->
  <section id="app" class="screen hidden">
    <header>
      <div class="head-info">
        <strong id="roomName"></strong>
        <span id="status"><i class="dot"></i><em id="statusText">Conectando…</em></span>
      </div>
      <button id="leave" class="ghost">Salir</button>
    </header>

    <nav class="tabs">
      <button data-tab="radio" class="on">Radio</button>
      <button data-tab="claves">Claves</button>
    </nav>

    <main>
      <div id="viewRadio" class="view">
        <div id="alert" class="alert hidden" role="alert"></div>
        <div id="peers" class="peers"></div>
        <div id="feed" class="feed"></div>
        <div id="live" class="live"></div>
        <div class="controls">
          <button id="ptt" class="ptt" aria-label="Botón para hablar">
            <span id="pttText">Mantén para hablar</span>
          </button>
          <div class="toggles">
            <label><input type="checkbox" id="optToggle"> Tocar para hablar</label>
            <label><input type="checkbox" id="optTranscribe" checked> Transcribir</label>
            <label><input type="checkbox" id="optRelease" checked> Liberar micrófono al no hablar</label>
            <label class="native-only"><input type="checkbox" id="optScreen"> Mantener pantalla encendida</label>
          </div>
          <p id="note" class="note"></p>
        </div>
      </div>

      <div id="viewClaves" class="view hidden">
        <input id="search" type="search" placeholder="Buscar clave (ej. 09, apoyo, G1)" autocomplete="off">
        <div id="clavesList" class="claves-list"></div>
      </div>
    </main>
  </section>

  <div id="audios" hidden></div>

  <script src="peerjs.min.js"></script>
  <script src="claves.js"></script>
  <script src="app.js"></script>
</body>
</html>
